[project]
name = "laat-card-rl"
version = "0.1.0"
description = "Gymnasium and Maskable PPO training stack for the Laat card game."
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115.0",
  "gymnasium>=1.0.0",
  "numpy>=1.26.0",
  "sb3-contrib>=2.5.0",
  "stable-baselines3>=2.5.0",
  "tensorboard>=2.18.0",
  "torch>=2.5.0",
  "tqdm>=4.67.0",
  "uvicorn>=0.32.0",
  "wandb>=0.18.0",
  "rich>=13.9.0",
]

[dependency-groups]
dev = [
  "pytest>=8.3.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["rl"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.uv.sources]
torch = [
  { index = "pytorch-cu124", marker = "sys_platform == 'win32' or sys_platform == 'linux'" },
]

[[tool.uv.index]]
name = "pytorch-cu124"
url = "https://download.pytorch.org/whl/cu124"
explicit = true
